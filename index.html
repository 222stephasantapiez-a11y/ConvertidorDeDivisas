<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convertidor de Divisas</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h3 mb-3 text-primary">Convertidor de Divisas</h1>
            <p class="text-muted mb-4">
              Ingresa un valor en COP y consulta su equivalente aproximado en las
              diferentes cotizaciones de Dólar API.
            </p>

            <div class="row g-3 align-items-end">
              <div class="col-12 col-md-8">
                <label for="valor" class="form-label">Valor en COP</label>
                <input
                  type="number"
                  id="valor"
                  class="form-control"
                  placeholder="Ejemplo: 100000"
                  min="0"
                />
              </div>
              <div class="col-12 col-md-4 d-grid">
                <button id="btn-convertir" class="btn btn-primary" type="button">
                  Convertir
                </button>
              </div>
            </div>

            <div id="estado" class="small mt-3 text-muted" aria-live="polite"></div>
            <div id="resultado" class="mt-4"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="convertir.js"></script>
</body>
</html>
